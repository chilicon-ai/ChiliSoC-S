# OpenOCD configuration for the riscv-tests debug suite (gdbserver.py) on
# ChiliSoC-S in simulation: the testbench's JTAG pins over remote_bitbang.
# chilisocs.py starts the model and sets REMOTE_BITBANG_HOST / _PORT and
# WORK_AREA; the TAP and target lines match sim/openocd/chilisocs.cfg.
adapter driver remote_bitbang
remote_bitbang host $::env(REMOTE_BITBANG_HOST)
remote_bitbang port $::env(REMOTE_BITBANG_PORT)
transport select jtag
reset_config none

jtag newtap chilisocs cpu -irlen 5 -expected-id 0x05c05001
target create chilisocs.cpu riscv -chain-position chilisocs.cpu
chilisocs.cpu configure -work-area-phys $::env(WORK_AREA) -work-area-size 8096 -work-area-backup 1

gdb_report_data_abort enable
gdb_report_register_access_error enable

# a CSR the core does not implement, for the non-existent register test
riscv expose_csrs 2288

init
halt

arm semihosting enable
