# RISCOF configuration: ChillU-S (Verilator, sim/tb/chillus_tb.sv) as the DUT,
# Spike as the reference (run_act.py --ref spike). Paths are relative to this file.
# Normally run through run_act.py (it sets ACT_JOBS and the tool paths).
[RISCOF]
ReferencePlugin=spike
ReferencePluginPath=spike
DUTPlugin=chillus
DUTPluginPath=chillus

[chillus]
pluginpath=chillus
ispec=chillus/chillus_isa.yaml
pspec=chillus/chillus_platform.yaml
target_run=1

[spike]
pluginpath=spike
