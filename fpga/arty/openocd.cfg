# OpenOCD configuration for ChiliSoC-S on the Arty A7-100T: a Digilent
# JTAG-HS2 on Pmod JD (fpga/README.md has the wiring). The TAP and target
# lines are sim/openocd/chilisocs.cfg's; keep the two in step.
#   openocd -f fpga/arty/openocd.cfg
source [find interface/ftdi/digilent-hs2.cfg]
# newer HS2 units report "Digilent USB Device", not the stock "Digilent Adept USB Device"
ftdi device_desc "Digilent USB Device"
adapter speed 1000
transport select jtag
reset_config none

# chilimix_debug: JTAG DTM (IR 5 bits), IDCODE of chilisocs_pkg::JTAG_IDCODE
jtag newtap chilisocs cpu -irlen 5 -expected-id 0x05c05001
target create chilisocs.cpu riscv -chain-position chilisocs.cpu
# work area: the top 4 KiB of SRAM1 (the stack starts at its end, so back it up)
chilisocs.cpu configure -work-area-phys 0x8001f000 -work-area-size 0x1000 -work-area-backup 1
chilisocs.cpu configure -event gdb-detach { resume }      ;# GDB detach lets the program run on
